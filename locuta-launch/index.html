<!DOCTYPE html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <!--
      ==========================================================================
      PIPELINE TEST COMPOSITION — placeholder, NOT the Locuta launch video.
      Purpose: prove preview + lint + check + render work end to end.
      Replace this file's contents when building the real launch film.
      1920x1080 · 30fps · 5s · solid bg + text + entrance animation + crossfade.
      ==========================================================================
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        font-family: "Inter", sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      /* Each scene is a full-bleed child that carries its own solid background
         (per the core rule: never rely on the composition root's own background). */
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }

      #sceneA {
        background: #0b1220; /* deep navy */
      }

      #sceneB {
        background: #0a2e1f; /* deep green */
        opacity: 0; /* hidden until the crossfade brings it in */
      }

      .headline {
        font-size: 180px;
        font-weight: 800;
        letter-spacing: -4px;
        color: #ffffff;
        line-height: 1;
      }

      .sub {
        font-size: 44px;
        font-weight: 400;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: #7dd3fc; /* sky */
      }

      .badge {
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #22c55e;
        color: #052e16;
        font-size: 110px;
        font-weight: 800;
        line-height: 1;
      }

      .headline2 {
        font-size: 96px;
        font-weight: 700;
        letter-spacing: -1px;
        color: #ffffff;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-0v0j" id="root" data-composition-id="main" data-start="0" data-fps="30" data-duration="5" data-width="1920" data-height="1080">
      <div data-hf-id="hf-2jwa" id="stage" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <!-- Scene A: solid navy + brand title -->
        <div data-hf-id="hf-gjm3" id="sceneA" class="scene">
          <h1 data-hf-id="hf-oeh5" id="titleA" class="headline">Locuta</h1>
          <p data-hf-id="hf-3cfc" id="subA" class="sub">HyperFrames pipeline</p>
        </div>

        <!-- Scene B: solid green + success badge -->
        <div data-hf-id="hf-5o4g" id="sceneB" class="scene">
          <div data-hf-id="hf-pafp" id="badge" class="badge">✓</div>
          <h2 data-hf-id="hf-e86t" id="titleB" class="headline2">Render pipeline OK</h2>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // --- Scene A entrance (the "one simple animation") ---
      tl.from("#titleA", { y: 60, autoAlpha: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.from("#subA", { y: 30, autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 0.6);

      // --- Crossfade A -> B (the "one basic transition") ---
      tl.to("#sceneA", { autoAlpha: 0, duration: 0.6, ease: "power1.inOut" }, 2.6);
      tl.fromTo("#sceneB", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "power1.inOut" }, 2.6);

      // --- Scene B entrance ---
      tl.from("#badge", { scale: 0, autoAlpha: 0, duration: 0.5, ease: "back.out(1.7)" }, 2.95);
      tl.from("#titleB", { y: 30, autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 3.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
